<img class="w-full h-full object-contain rounded-md" data-alt="Studio packshot of Sutas full fat fresh milk 1 liter carton on a stark high contrast studio background, perfectly lit for grocery accessibility, vibrant crisp branding." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA58lbHz2OERglFxCAiUvniOgCogsPAdT5Ura7Cyue59nyjZf3iw6mxyuk-qWKpayLaAGocEFNBee14RXunpv8CjbX81WvY0RBbh6USTd_ruAyFIxwMrNR7F_OqMndXs4ynATfv9aNNDAQr2OMAt0kWTXlyi5IM45FELeF3TCn2CYpUFxsarvyp8_OTqqVZVUZhkZ_y9vzOROV5fmO9vPDC4xswmnjn95XvpoyY_FY"/>
<div class="absolute inset-0 bg-primary-container/10 pointer-events-none"></div>

</div>

        5 TL İNDİRİM
      </span>
</div>
<div class="flex items-baseline gap-3 flex-wrap">
<span class="font-price-huge text-price-huge text-primary-container font-extrabold tracking-tight" id="unit-price-display">
        24,90 ₺
      </span>
<span class="font-headline-md text-headline-md line-through text-outline">
        29,90 ₺
      </span>
</div>
<div class="flex items-center gap-2 pt-1">
<span class="material-symbols-outlined text-tertiary-fixed text-[24px]">info</span>
<span class="font-body-lg text-body-lg text-on-surface font-medium">Litre başı: 24,90 ₺</span>
</div>

</div>
</div>

<button class="w-full h-[76px] min-h-[76px] rounded-xl bg-primary-container text-on-primary flex items-center justify-center gap-3 px-4 active:scale-[0.98] transition-transform shadow-xl" id="add-to-cart-btn">
<span class="material-symbols-outlined text-[36px] font-black" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
<span class="font-headline-md text-headline-md font-black tracking-wide text-center" id="btn-cart-text">
        SEPETE EKLE (24,90 ₺)
      </span>
</button>
<button class="w-full h-[68px] min-h-[68px] rounded-xl bg-surface-container-high text-primary flex items-center justify-center gap-3 px-4 active:scale-[0.98] transition-transform" onclick="history.back()">
<span class="material-symbols-outlined text-[32px] font-bold">replay</span>
<span class="font-label-lg text-label-lg font-bold">TEKRAR ÇEK / FARKLI ÜRÜN</span>
</button>
</div>
</div>
<script>
  (() => {
    let count = 1;
    const unitPrice = 24.90;

    const qtyText = document.getElementById('qty-text');
    const calcTotal = document.getElementById('calc-total');
    const btnCartText = document.getElementById('btn-cart-text');
    const btnDecrease = document.getElementById('btn-decrease');
    const btnIncrease = document.getElementById('btn-increase');
    const audioBtn = document.getElementById('audio-read-btn');

    function formatPrice(val) {
      return val.toFixed(2).replace('.', ',') + ' ₺';
    }

    function updateView() {
      qtyText.textContent = count + ' ADET';
      const total = count * unitPrice;
      const formatted = formatPrice(total);
      calcTotal.textContent = formatted;
      btnCartText.textContent = 'SEPETE EKLE (' + formatted + ')';

      if (count <= 1) {
        btnDecrease.classList.add('opacity-40');
      } else {
        btnDecrease.classList.remove('opacity-40');
      }
    }

    btnIncrease.addEventListener('click', () => {
      if (count < 99) {
        count++;
        updateView();
      }
    });

    btnDecrease.addEventListener('click', () => {
      if (count > 1) {
        count--;
        updateView();
      }
    });

    audioBtn.addEventListener('click', () => {
      const originalText = audioBtn.innerHTML;
      audioBtn.innerHTML = `
        <span class="material-symbols-outlined text-primary-container text-[30px] animate-pulse">record_voice_over</span>
        <span class="font-body-xl text-body-xl text-primary-container font-bold">Sesli Okunuyor...</span>
      `;
      setTimeout(() => {
        audioBtn.innerHTML = originalText;
      }, 2400);
    });

    updateView();
  })();
</script></main></body></html>
